# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

format = """
$character$directory$git_branch$git_status$python$docker_context
[▶ ](bold green)
"""
# [ ](bold #ff6b6b)[▶ ](bold green)

[character]
success_symbol = "[➜](bold green)"
error_symbol = "[➜](bold #ff6b6b)"

[directory]
truncation_length = 8
format = '[\[$path]($style)$read_only($read_only_style)[\]]($style): '

[git_status]
diverged = "🔱 🏎️ 💨 ×${ahead_count} 🐢 ×${behind_count}"
staged = ' [\($count\)](green) '
modified = ' [\($count\)](#ff6bee) '
untracked = ' [\($count\)](yellow)'
conflicted = "  "
format = '([\[$conflicted$deleted$renamed$modified$staged$untracked$ahead_behind\]]($style) )'

[git_branch]
symbol = "  "
format = "[$symbol$branch]($style) "
style = "bold #ff6bee"

[docker_context]
format = "docker: [🐋 $context](blue bold)"
disabled = false

[time]
disabled = true
use_12hr = true
format = " [$time]($style) "

[package]
disabled = true
